name: test

# The policies are tested against pfw as it is built today: pfw is checked
# out, built, packaged and installed the way its own CI does it, and the
# pfw-core that build fetched and compiled is what the policies run on.
#
#   interpreter   test/run.mjs: every policy compiles, has test cases, resets
#                 what it names and leaves ordinary traffic alone
#   kernel        test/kernel-ns.sh: each policy loaded into the real XDP
#                 program and driven over loopback TCP
#   end to end    test/e2e.mjs: the firewall brought up with `pfw up`, each
#                 policy enforced with `pfw apply -f`, real requests sent at
#                 a real server; the ones a policy names must be cut off
#
# The last two run in a network namespace of their own, with their own yeetd.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: yeet-src/pfw
          path: pfw

      - name: Install yeet
        run: |
          set -euo pipefail
          # --no-phone-home: the installer otherwise reports the runner's OS
          # version on exit.
          curl -fsSL https://yeet.cx | sh -s -- --no-phone-home
          for i in $(seq 1 30); do systemctl is-active --quiet yeetd && break; sleep 1; done
          systemctl is-active yeetd
          yeet version

      - name: Build pfw, and the pfw-core it embeds
        run: |
          set -euo pipefail
          make -C pfw
          make -C pfw pkg
          git -C pfw rev-parse HEAD
          git -C pfw/.deps/pfw-core rev-parse HEAD
          test -f pfw/.deps/pfw-core/bin/vm.bpf.o

      - name: Install pfw, as a user would
        run: |
          set -euo pipefail
          cp pfw/install.sh "$RUNNER_TEMP/install.sh"
          cd "$RUNNER_TEMP"
          # --no-up: the installer would start the firewall on the runner's
          # own daemon, which takes a yeet login. The end-to-end test starts
          # it itself, on a daemon of its own inside a namespace.
          sh ./install.sh --package "$GITHUB_WORKSPACE/pfw/pkg/pfw.tar.gz" --no-login --no-up
          command -v pfw
          pfw --version

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Interpreter
        run: PFW_CORE="$PWD/pfw/.deps/pfw-core" node test/run.mjs

      - name: Kernel, in a namespace of its own
        run: PFW_CORE="$PWD/pfw/.deps/pfw-core" sh test/kernel-ns.sh

      - name: End to end, with pfw
        run: PFW="$(command -v pfw)" sh test/in-namespace.sh "$(command -v node)" test/e2e.mjs
