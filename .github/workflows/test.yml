name: test

# The policies are tested against pfw as it is built today: pfw is checked
# out, built, packaged and installed the way its own CI does it, and the
# pfw-core that build fetched and compiled is what the policies run on.
#
#   interpreter   test/run.mjs: every policy compiles, has test cases, resets
#                 what it names and leaves ordinary traffic alone
#   kernel        test/kernel-ns.sh: each policy loaded into the real XDP
#                 program and driven over loopback TCP
#   end to end    test/e2e.mjs: the firewall brought up with `pfw up`, each
#                 policy enforced with `pfw apply -f`, real requests sent at
#                 a real server; the ones a policy names must be cut off.
#                 Needs the YEET_API_KEY secret, and is skipped without it
#
# The kernel test runs in a network namespace of its own, with its own yeetd.
# The end-to-end test runs on the runner's loopback, which is thrown away.
#
# A second job asks real .NET Framework, on Windows, what the token that
# runtimes/aspnet-anticsrf.pfc lets through actually looks like.
#
# A third starts the real servers three policies were written against and
# asks each which spellings of a request it reads (test/real/). Harmless
# requests only: a method name the action does not have, a protocol the
# server refuses, a command that wants a login first.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: yeet-src/pfw
          path: pfw

      - name: Install yeet
        run: |
          set -euo pipefail
          # --no-phone-home: the installer otherwise reports the runner's OS
          # version on exit.
          curl -fsSL https://yeet.cx | sh -s -- --no-phone-home
          for i in $(seq 1 30); do systemctl is-active --quiet yeetd && break; sleep 1; done
          systemctl is-active yeetd
          yeet version

      - name: Build pfw, and the pfw-core it embeds
        run: |
          set -euo pipefail
          # The build fetches the yeet toolchain through GitHub's API, which
          # now and then answers a runner's shared address with 403.
          for attempt in 1 2 3 4; do
            make -C pfw && break
            [ "$attempt" -lt 4 ] || exit 1
            echo "::notice::the pfw build failed (attempt $attempt): trying again in a minute"
            sleep 60
          done
          make -C pfw pkg
          git -C pfw rev-parse HEAD
          git -C pfw/.deps/pfw-core rev-parse HEAD
          test -f pfw/.deps/pfw-core/bin/vm.bpf.o

      # yeet serves a login page in place of every route of a host that is not
      # logged in, so driving a firewall through `pfw` takes a login. A key in
      # the YEET_API_KEY secret gives the runner one; install.sh logs in with
      # it. A pull request from a fork has no secrets: it installs without a
      # login, and the end-to-end step below is skipped.
      - name: Install pfw, as a user would
        env:
          YEET_API_KEY: ${{ secrets.YEET_API_KEY }}
        run: |
          set -euo pipefail
          cp pfw/install.sh "$RUNNER_TEMP/install.sh"
          cd "$RUNNER_TEMP"
          # --no-up: the end-to-end test starts the firewall itself, from a
          # copy of the service that keeps its state in a scratch directory.
          if [ -n "$YEET_API_KEY" ]; then
            sh ./install.sh --package "$GITHUB_WORKSPACE/pfw/pkg/pfw.tar.gz" --no-up
          else
            sh ./install.sh --package "$GITHUB_WORKSPACE/pfw/pkg/pfw.tar.gz" --no-login --no-up
          fi
          command -v pfw
          pfw --version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Interpreter
        run: PFW_CORE="$PWD/pfw/.deps/pfw-core" node test/run.mjs

      - name: Kernel, in a namespace of its own
        run: PFW_CORE="$PWD/pfw/.deps/pfw-core" sh test/kernel-ns.sh

      # On the runner's own loopback, not in a namespace: a namespace has no
      # route out, so nothing inside it can log in, and the runner is thrown
      # away afterwards. The policies' own ports include 80 and 443.
      - name: End to end, with pfw
        env:
          YEET_API_KEY: ${{ secrets.YEET_API_KEY }}
        run: |
          if [ -z "$YEET_API_KEY" ]; then
            echo "::warning::no YEET_API_KEY secret, so pfw cannot be driven here: the end-to-end test is skipped"
            exit 0
          fi
          sudo sysctl -q -w net.ipv4.ip_unprivileged_port_start=0
          PFW="$(command -v pfw)" SCRATCH_HOME="$(mktemp -d)" node test/e2e.mjs

  # runtimes/aspnet-anticsrf.pfc lets through one shape of token and resets
  # every other. Whether that shape is the one the module really writes is a
  # question about Microsoft's .NET Framework, so it is asked there.
  anticsrf-token-layout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: What ObjectStateFormatter really writes
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.Web.dll /out:layout.exe test\dotnet\TokenLayout.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\layout.exe
          exit $LASTEXITCODE

  # Three policies match what a server accepts, not what an advisory printed.
  # What each server accepts is asked of it here, so a release that reads a
  # request differently fails this job instead of going unnoticed.
  real-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Start Struts 2.3.28, ProFTPD with mod_copy, and Plex Media Server
        run: |
          set -euo pipefail
          docker run -d --name struts -p 127.0.0.1:8080:8080 vulhub/struts2:2.3.28
          docker run -d --name plex -p 127.0.0.1:32400:32400 plexinc/pms-docker:latest
          docker run -d --name proftpd -p 127.0.0.1:2121:21 debian:12-slim sh -c '
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq proftpd-core >/dev/null
            sed -i "s/^#LoadModule mod_copy.c/LoadModule mod_copy.c/" /etc/proftpd/modules.conf
            proftpd -v
            exec proftpd -n'

      - name: Which spellings of method: Struts reads
        run: node test/real/struts.mjs 8080

      - name: Which spellings of SITE CPFR ProFTPD takes
        run: |
          node test/real/proftpd.mjs 2121
          docker logs proftpd 2>&1 | grep -i "proftpd version" || true

      - name: Which spellings of protocol Plex reads
        run: |
          node test/real/plex.mjs 32400 plex
          curl -s http://127.0.0.1:32400/identity | grep -o 'version="[^"]*"' || true
